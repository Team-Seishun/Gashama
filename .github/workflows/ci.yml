name: CI (Lint & Test)

# 実行されるタイミング：mainブランチに向けてPRが作成・更新されたとき
on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest # 実行環境（仮想サーバー）
    
    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20.x # 開発環境に合わせて変更してください（18.xなど）
          cache: 'npm'       # yarnを使っている場合は 'yarn' に変更

      - name: パッケージのインストール
        run: npm ci          # npm installより厳密でCI向けのコマンド

      - name: Lint（コード整形チェック）の実行
        run: npm run lint

      - name: テストの実行
        run: npm run test

  pgtap:
    name: pgTAPテスト（SQLマイグレーション）
    runs-on: ubuntu-latest
    # 複数PRのCIが同時にリンク済みのリモートDBへ接続すると行ロックが競合し
    # 得るため、pgTAPテストは常に1件ずつ順番に実行する(#65で決定)。
    concurrency:
      group: pgtap-supabase-db
      cancel-in-progress: false

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Supabase CLIのセットアップ
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: (一時診断) SUPABASE_DB_URLの形式を値を出さずに確認
        # "failed to parse connection string"の原因調査用。値そのものは一切
        # 出力せず、長さ・接頭辞・記号の個数といった構造だけを確認する。
        # 問題が解決したらこのステップは削除する。
        run: |
          echo "length: ${#SUPABASE_DB_URL}"
          echo "starts_with_postgresql://: $([[ "$SUPABASE_DB_URL" == postgresql://* ]] && echo yes || echo no)"
          echo "starts_with_postgres://: $([[ "$SUPABASE_DB_URL" == postgres://* ]] && echo yes || echo no)"
          echo "at_count: $(grep -o '@' <<< "$SUPABASE_DB_URL" | wc -l)"
          echo "has_leading_or_trailing_space: $([[ "$SUPABASE_DB_URL" =~ ^[[:space:]]|[[:space:]]$ ]] && echo yes || echo no)"
          echo "has_bracket: $([[ "$SUPABASE_DB_URL" == *"["* || "$SUPABASE_DB_URL" == *"]"* ]] && echo yes || echo no)"
          echo "has_quote: $([[ "$SUPABASE_DB_URL" == *\"* || "$SUPABASE_DB_URL" == *"'"* ]] && echo yes || echo no)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: pgTAPテストの実行
        # supabase/migrations/には差分マイグレーションしかなく、profiles/trades等の
        # 土台となるテーブル自体を作るCREATE TABLE文が存在しないため、真っさらな
        # ローカル/CI用DBを一から構築する方式(--local/--linked)ではテストが実行
        # できない(#61/#65で確定)。そのため、リンク済みのリモートプロジェクトに
        # 対して、IPv4対応のコネクションプーラー経由(--db-url)で直接実行する。
        # --linked(内部的にIPv6専用の直接接続ホストを使う)は、GitHub Actionsの
        # ホスト型ランナーがIPv6の発信接続に対応していないため使えない。
        # テストは全てBEGIN/ROLLBACKで囲まれており、実データへの副作用はない。
        run: supabase test db --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
